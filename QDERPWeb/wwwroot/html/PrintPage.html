<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print DataGrid</title>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.1/css/dx.light.css" />
    <script src="https://cdn3.devexpress.com/jslib/23.1/js/dx.all.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .ribbon-toolbar {
            background: #f5f5f5;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #ccc;
        }

        .ribbon-button {
            background: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }

            .ribbon-button:hover {
                background: #0056b3;
            }

        .print-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .print-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="ribbon-toolbar">
        <button class="ribbon-button" onclick="window.print()">Print</button>
        <button class="ribbon-button" onclick="window.close()">Close</button>
    </div>
    <div class="print-title" id="print-title"></div>
    <div class="print-container" id="print-content">
        <!-- DataGrid will be injected here -->
    </div>
    <script>
        window.onload = function () {
            var dataGridHtml = localStorage.getItem("dataGridHtml");
            var gridTitle = localStorage.getItem("gridTitle");
            if (dataGridHtml) {
                document.getElementById("print-content").innerHTML = dataGridHtml;
            }
            if (gridTitle) {
                document.getElementById("print-title").innerText = gridTitle;
            }
        };
    </script>
</body>
</html>
